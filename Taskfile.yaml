version: "3"

vars:
  INFRA_CONFIG_LOCAL: ./cmd/proxy/infrastructure.yaml
  ROUTES_CONFIG_LOCAL: ./cmd/proxy/routes.yaml

tasks:
  default:
    cmd: task --list

  run:proxy:
    desc: Run proxy locally
    cmd: INFRA_CONFIG_PATH={{.INFRA_CONFIG_LOCAL}} ROUTES_CONFIG_PATH={{.ROUTES_CONFIG_LOCAL}} go run ./cmd/proxy

  up:local:
    desc: Start proxy locally and backend containers in docker
    cmds:
      - docker compose up -d users-prod users-test orders
      - INFRA_CONFIG_PATH={{.INFRA_CONFIG_LOCAL}} ROUTES_CONFIG_PATH={{.ROUTES_CONFIG_LOCAL}} go run ./cmd/proxy

  lint:
    desc: Runs golangci-lint
    cmd: golangci-lint run ./...

  fmt:
    desc: Runs go fmt
    cmd: go fmt ./...

  test:
    desc: Run the end-to-end smoke test, then the unit tests
    cmds:
      - task: test:smoke
      - go test ./cmd/... ./internal/... -count=1

  test:smoke:
    desc: End-to-end smoke test over the real wiring (needs no running stack)
    cmd: go test ./internal/proxy/ -run TestSmoke -count=1 -v

  test:deep:
    desc: Run exhaustive testing suite
    cmd: >
          go test ./cmd/... ./internal/...
          -count=1
          -v
          -race
          -covermode=atomic
          -coverprofile=coverage.out
          -failfast
          -timeout=5m

  up:
    desc: Start all containers in docker
    cmd: docker compose up -d --build

  down:
    desc: Stop all running containers
    cmd: docker compose down

  down:local:
    desc: Stop all running containers and kills the process called "proxy" (hopefully the right one)
    cmds:
      - docker compose down
      - pkill -f proxy || true
    

