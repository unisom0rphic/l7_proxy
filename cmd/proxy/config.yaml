net_timeouts_s:
  transport:
    tcp: 10
    keep_alive: 30
    tls: 10
    response_header: 10
    idle_conn: 120
  server:
    context: 5
    read_header: 15
    idle: 15
  

upstreams:
  - name: test
    url: http://localhost:3000
    timeout_ms: 2000
  - name: users-prod
    url: http://users-prod:3001
    timeout_ms: 2000 
  - name: users-test
    url: http://users-test:3002
    timeout_ms: 2000 

routes:
  - match:
      path_prefix: /api/users
    upstream: users-prod
    mirror:
      upstream: users-test
      ratio: 0.2

  - match:
      path_prefix: /api/orders
      method: GET
    upstream: orders