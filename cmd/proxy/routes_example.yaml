upstreams:
  - name: users-prod
    host: http://users-prod:3001
    timeout-ms: 500
  - name: users-test
    host: http://users-test:3002
    timeout-ms: 500
  - name: orders
    host: http://orders:3003
    timeout-ms: 500

routes:
  - rules:
      path: /api/users_prod
      rewrite: /api/users_prod
    upstream: users-prod
    mirrors:
      - upstream: users-test
        ratio: 0.2

  - rules:
      path-prefix: /orders
      rewrite: /api/orders
      method: GET
    upstream: orders
