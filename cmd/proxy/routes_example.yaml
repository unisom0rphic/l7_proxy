upstreams:
  - name: users-prod
    host: http://users-prod:3001
    timeout-ms: 500
  - name: users-test
    host: http://users-test:3002
    timeout-ms: 500
  - name: orders
    host: http://orders:3003
    timeout-ms: 500

routes:
  - rules:
      path: /api/users
    upstream: users-prod
    mirrors:
      - upstream: users-test
        ratio: 0.2

  - rules:
      path-prefix: /orders
      rewrite: /api/orders
      method: GET
    upstream: orders

  - rules:
      path-prefix: /admin
      headers:
        - name: X-Admin-Token
          op: present
      client-cidrs:
        - 172.16.0.0/12  # docker default address pool range
    upstream: users-prod
